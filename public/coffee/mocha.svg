<!-- Simple SVG placeholder for Mocha -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D2418;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0F0A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mochaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3E2723;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#5D4037;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4E342E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3E2723;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad3)"/>
  
  <!-- Tall glass -->
  <rect x="320" y="180" width="160" height="280" rx="10" fill="none" stroke="#CCCCCC" stroke-width="4" opacity="0.5"/>
  
  <!-- Mocha liquid with chocolate layers -->
  <rect x="325" y="200" width="150" height="250" rx="8" fill="url(#mochaGrad)"/>
  
  <!-- Whipped cream on top -->
  <ellipse cx="400" cy="200" rx="82" ry="35" fill="#FFFAF0"/>
  <ellipse cx="380" cy="185" rx="40" ry="25" fill="#FFF8DC"/>
  <ellipse cx="420" cy="185" rx="35" ry="22" fill="#FFF8DC"/>
  <ellipse cx="400" cy="175" rx="30" ry="20" fill="#FFFFFF"/>
  
  <!-- Chocolate drizzle -->
  <path d="M 380 200 Q 385 210 380 220" stroke="#4E342E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 400 195 Q 405 210 400 225" stroke="#4E342E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 420 200 Q 415 215 420 230" stroke="#4E342E" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Shadow -->
  <ellipse cx="400" cy="490" rx="100" ry="20" fill="#000000" opacity="0.3"/>
  
  <!-- Text label -->
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#F5E6D3" text-anchor="middle">Mocha</text>
</svg>
