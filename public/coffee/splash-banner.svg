<!-- Coffee splash banner -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 400">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3D2418;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4D3428;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3D2418;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="splash" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4037;stop-opacity:0.8" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="400" fill="url(#splashBg)"/>
  
  <!-- Central splash -->
  <circle cx="960" cy="200" r="120" fill="url(#splash)" opacity="0.6"/>
  <circle cx="940" cy="180" r="80" fill="#6F4E37" opacity="0.5"/>
  <circle cx="980" cy="220" r="90" fill="#8B6F47" opacity="0.4"/>
  
  <!-- Droplets -->
  <circle cx="700" cy="150" r="35" fill="#6F4E37" opacity="0.5"/>
  <circle cx="1220" cy="170" r="40" fill="#8B6F47" opacity="0.5"/>
  <circle cx="600" cy="250" r="25" fill="#8B7355" opacity="0.4"/>
  <circle cx="1320" cy="230" r="30" fill="#6F4E37" opacity="0.4"/>
  <circle cx="500" cy="180" r="20" fill="#8B6F47" opacity="0.3"/>
  <circle cx="1420" cy="200" r="25" fill="#8B7355" opacity="0.3"/>
  
  <!-- Coffee beans scattered -->
  <ellipse cx="800" cy="100" rx="15" ry="20" fill="#5D4037" opacity="0.7" transform="rotate(30 800 100)"/>
  <ellipse cx="1120" cy="120" rx="15" ry="20" fill="#5D4037" opacity="0.7" transform="rotate(-20 1120 120)"/>
  <ellipse cx="650" cy="300" rx="15" ry="20" fill="#5D4037" opacity="0.6" transform="rotate(45 650 300)"/>
  <ellipse cx="1270" cy="280" rx="15" ry="20" fill="#5D4037" opacity="0.6" transform="rotate(-35 1270 280)"/>
</svg>
