<!-- Simple SVG placeholder for centered coffee cup -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="cupGlow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#4F9C8F;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="cupColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D5C4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Glow effect -->
  <circle cx="400" cy="400" r="300" fill="url(#cupGlow)"/>
  
  <!-- Cup body -->
  <path d="M 280 350 Q 270 380 280 450 Q 290 520 400 520 Q 510 520 520 450 Q 530 380 520 350 Z" 
        fill="url(#cupColor)" stroke="#C9B8A0" stroke-width="4"/>
  
  <!-- Handle -->
  <path d="M 520 380 Q 580 380 590 420 Q 600 460 560 480 Q 540 490 520 470" 
        fill="none" stroke="#C9B8A0" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Coffee liquid -->
  <ellipse cx="400" cy="350" rx="120" ry="35" fill="#5D4037"/>
  
  <!-- Steam wisps -->
  <path d="M 360 320 Q 355 300 360 280 Q 365 260 360 240" 
        stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M 400 310 Q 405 285 400 260 Q 395 235 400 210" 
        stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 440 320 Q 445 300 440 280 Q 435 260 440 240" 
        stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Shadow -->
  <ellipse cx="400" cy="540" rx="140" ry="30" fill="#000000" opacity="0.2"/>
</svg>
