<!-- Simple SVG for coffee bean -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="beanGrad" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#8B6F47;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5D4037;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Coffee bean shape -->
  <ellipse cx="50" cy="50" rx="35" ry="45" fill="url(#beanGrad)" transform="rotate(15 50 50)"/>
  
  <!-- Center line -->
  <path d="M 50 15 Q 45 50 50 85" stroke="#3E2723" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
